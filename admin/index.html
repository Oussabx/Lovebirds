<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lovebirds · dashboard</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4E0C1C">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ------------------------------------------------------------- login -->
<div class="gate" data-gate hidden>
  <form class="gate__card" data-login>
    <div class="gate__mark" aria-hidden="true"></div>
    <h1>lovebirds</h1>
    <p class="gate__sub">Shop dashboard</p>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="gate__error" data-login-error hidden></p>
    <button class="btn btn--block" type="submit" data-login-submit>Sign in</button>
    <p class="gate__hint" data-login-hint hidden></p>
  </form>
</div>

<!-- ------------------------------------------------------------- app -->
<div class="app" data-app hidden>
  <aside class="side">
    <div class="side__brand">
      <span class="side__mark" aria-hidden="true"></span>
      <span>lovebirds</span>
    </div>
    <nav class="side__nav" data-nav></nav>
    <div class="side__foot">
      <a class="side__link" href="../index.html" target="_blank" rel="noopener">View the shop ↗</a>
      <button class="side__link" data-logout>Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="topbar__burger" data-side-toggle aria-label="Menu"><span></span><span></span><span></span></button>
      <div>
        <h1 data-view-title>Overview</h1>
        <p class="topbar__sub" data-view-sub></p>
      </div>
      <div class="topbar__actions">
        <span class="saved" data-saved hidden>Saved</span>
        <button class="btn btn--ghost btn--sm" data-discard hidden>Discard</button>
        <button class="btn btn--sm" data-save disabled>Save changes</button>
      </div>
    </header>

    <div class="banner banner--warn" data-store-banner hidden></div>
    <div class="view" data-view></div>
  </main>
</div>

<div class="toasts" data-toasts aria-live="polite"></div>
<div class="modal" data-modal hidden></div>

<script src="../assets/js/defaults.js"></script>
<script src="admin.js"></script>
<script src="admin-views.js"></script>
</body>
</html>
